# Traefik Dashboard IngressRoute Configuration
# Access via: https://gke-traefik.example.com
# DNS Record needed (replace example.com with your actual domain): gke-traefik.example.com  A  <TRAEFIK_EXTERNAL_IP>

---
# HTTP to HTTPS redirect middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: traefik-v2
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
# HTTP IngressRoute for Traefik Dashboard (for ACME challenges and redirect)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard-http
  namespace: traefik-v2
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`gke-traefik.example.com`)
      kind: Rule
      services:
        - name: traefik
          port: 8080
      middlewares:
        - name: https-redirect

---
# HTTPS IngressRoute for Traefik Dashboard
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik-v2
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`gke-traefik.example.com`)
      kind: Rule
      services:
        - name: traefik
          port: 8080
  tls:
    certResolver: letsencrypt